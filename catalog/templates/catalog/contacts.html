<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты — django-orm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="{% url 'catalog:home' %}">django-orm</a>
            <a class="nav-link text-white" href="{% url 'catalog:contacts' %}">Контакты</a>
        </div>
    </nav>
    <main class="container my-5">
        <h1 class="display-5 mb-4">Контакты</h1>
        {% if contact_list %}
            <ul class="list-group">
                {% for contact in contact_list %}
                    <li class="list-group-item">
                        <strong>{{ contact.name }}</strong> — {{ contact.email }}
                        <p class="mb-0 mt-1 text-muted">{{ contact.message }}</p>
                    </li>
                {% endfor %}
            </ul>
        {% else %}
            <p class="lead">Пока нет контактных данных. Заполните их в админке.</p>
        {% endif %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
