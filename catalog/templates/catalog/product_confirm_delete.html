{% extends "catalog/base.html" %}
{% load static %}

{% block title %}Удалить товар — Мой сайт{% endblock %}

{% block content %}
<section class="py-5">
    <div class="container" style="max-width: 560px;">
        <h1 class="h3 fw-bold mb-3">Удаление товара</h1>
        <p class="text-muted mb-4">
            Вы уверены, что хотите удалить «<strong>{{ product.name }}</strong>»? Это действие нельзя отменить.
        </p>
        <form method="post">
            {% csrf_token %}
            <div class="d-flex flex-wrap gap-2">
                <button type="submit" class="btn btn-danger">Да, удалить</button>
                <a href="{% url 'catalog:product_manage' %}" class="btn btn-outline-secondary">Отмена</a>
            </div>
        </form>
    </div>
</section>
{% endblock %}
