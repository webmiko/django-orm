{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Мой сайт{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{% static 'catalog/css/custom.css' %}" rel="stylesheet">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="layout-wrapper">
        <header>
            {% include 'catalog/includes/main_menu.html' %}
        </header>

        <button class="mobile-menu-toggle d-md-none" id="mobileMenuToggle" aria-label="Открыть меню">
            <i class="bi bi-list"></i>
        </button>
        <div class="mobile-menu-overlay" id="mobileMenuOverlay"></div>

        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <footer class="py-3 mt-auto">
        <div class="container text-center"></div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'catalog/js/mobile-menu.js' %}"></script>
    <script src="{% static 'catalog/js/theme-toggle.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
